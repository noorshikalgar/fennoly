<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#4f46e5" />
		<meta name="description" content="Fennoly — your family drive" />
		<link rel="icon" href="%sveltekit.assets%/icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192.png" />
		<title>Fennoly</title>
		<script>
			// Apply the saved theme before first paint, so the page never flashes.
			(function () {
				try {
					var t = localStorage.getItem('fennoly-theme') || 'system';
					if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					document.documentElement.dataset.theme = t;
					var l = localStorage.getItem('fennoly-locale');
					if (l) document.documentElement.lang = l;
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
