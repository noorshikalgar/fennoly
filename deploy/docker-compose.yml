# Fennoly for your home server.
#   1. Change POSTGRES_PASSWORD (twice) below.
#   2. docker compose -f deploy/docker-compose.yml up -d --build
#   3. Open http://<server-ip>:8686 and create the admin account.
# Put it behind HTTPS (Caddy) or a VPN (Tailscale/Headscale) before using it
# outside your home network, and set FENNOLY_SECURE_COOKIES=true when on HTTPS.
name: fennoly

services:
  fennoly:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FENNOLY_DATABASE_URL: postgres://fennoly:change-me@postgres:5432/fennoly
      FENNOLY_SECURE_COOKIES: "false"
      FENNOLY_MAX_UPLOAD_GB: "50"
      FENNOLY_TRASH_DAYS: "30"
    ports:
      - "8686:8686"
    volumes:
      - ./fennoly-data:/data

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fennoly
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: fennoly
    volumes:
      - ./fennoly-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fennoly"]
      interval: 5s
      timeout: 3s
      retries: 10
